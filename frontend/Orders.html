<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - SwiftCart</title>
    <link rel="icon" type="image/svg+xml" href="images/swiftcart-favicon.svg">
    <link rel="stylesheet" href="css/style2.css?v=20260402-1815">
    <link rel="stylesheet" href="css/index.css?v=20260402-1815">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body data-page="orders">
    <header>
        <div class="navbar">
            <a class="icon" href="index.html">
                <div class="nav-logo border"><div class="logo"></div></div>
            </a>
            <div class="nav-search compact-search">
                <input placeholder="Your orders" class="search-input" readonly>
                <a class="Search-icon" href="index.html"><i class="fa-solid fa-store"></i></a>
            </div>
            <a class="icon" href="Account_Details.html">
                <div class="nav-signin border">
                    <p><span>Hello, <span data-user-name>Shopper</span></span></p>
                    <p class="nav-second">Account & Lists</p>
                </div>
            </a>
            <a class="icon" href="Cart.html">
                <div class="nav-cart border">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Cart
                    <span class="cart-count" data-cart-count>0</span>
                </div>
            </a>
        </div>
    </header>

    <main class="cart-layout">
        <section class="cart-panel">
            <div class="section-head cart-head">
                <div>
                    <p class="eyebrow">Order History</p>
                    <h2>Track purchases and recent checkouts</h2>
                </div>
            </div>
            <section class="orders-utility-bar">
                <div id="orderStats" class="order-stats-grid"></div>
                <div class="orders-toolbar">
                    <input id="orderSearchInput" type="search" placeholder="Search by order ID, product name, or status">
                    <select id="orderStatusFilter">
                        <option value="all">All Orders</option>
                        <option value="Placed">Placed</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="Packed">Packed</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Partially Cancelled">Partially Cancelled</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
                <p id="ordersStatus" class="status-copy"></p>
            </section>
            <div id="ordersList" class="cart-items"></div>
        </section>

        <aside class="summary-card">
            <h3>Account Snapshot</h3>
            <p class="status-copy">Use this page to monitor order status after checkout. Orders are stored in the new SQLite backend.</p>
            <a class="hero-cta inline-button" href="index.html">Continue Shopping</a>
        </aside>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <div>Track Orders</div>
            <div>Secure Payments</div>
            <div>© 2026 SwiftCart.com</div>
        </div>
    </footer>

    <script src="js/products.js?v=20260402-1815"></script>
    <script src="js/app.js?v=20260402-1815"></script>
</body>
</html>
